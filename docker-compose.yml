version: "3.9"

services:
  saturn:
    image: saturn:latest
    container_name: saturn
    build: .
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m
      - SATURN_AGENT_ENABLED=${SATURN_AGENT_ENABLED:-}
      - SATURN_AGENT_ENDPOINT=${SATURN_AGENT_ENDPOINT:-}
      - SATURN_AGENT_MODEL=${SATURN_AGENT_MODEL:-}
      - SATURN_AGENT_API_KEY_ENV=${SATURN_AGENT_API_KEY_ENV:-}
      - SATURN_AGENT_API_KEY=${SATURN_AGENT_API_KEY:-}
      - SATURN_AGENT_TIMEOUT_SECONDS=${SATURN_AGENT_TIMEOUT_SECONDS:-}
      - SATURN_AGENT_MAX_COMPLETION_TOKENS=${SATURN_AGENT_MAX_COMPLETION_TOKENS:-}
      - SATURN_AGENT_THINKING_ENABLED=${SATURN_AGENT_THINKING_ENABLED:-}
      - SATURN_AGENT_MAX_CONCURRENT_REQUESTS=${SATURN_AGENT_MAX_CONCURRENT_REQUESTS:-}
      - SATURN_AGENT_MAX_STEPS=${SATURN_AGENT_MAX_STEPS:-}
      - SATURN_AGENT_MAX_TOOL_CALLS_PER_TURN=${SATURN_AGENT_MAX_TOOL_CALLS_PER_TURN:-}
      - SATURN_AGENT_MAX_TOOL_CALLS=${SATURN_AGENT_MAX_TOOL_CALLS:-}
      - SATURN_AGENT_MAX_CALLS_PER_TOOL=${SATURN_AGENT_MAX_CALLS_PER_TOOL:-}
      - SATURN_AGENT_MAX_TOOL_FAILURES=${SATURN_AGENT_MAX_TOOL_FAILURES:-}
      - SATURN_AGENT_TOOL_TIMEOUT_MILLIS=${SATURN_AGENT_TOOL_TIMEOUT_MILLIS:-}
      - SATURN_AGENT_MAX_PROMPT_CHARS=${SATURN_AGENT_MAX_PROMPT_CHARS:-}
      - SATURN_AGENT_MAX_OUTPUT_CHARS=${SATURN_AGENT_MAX_OUTPUT_CHARS:-}
      - SATURN_AGENT_MEMORY_TURNS=${SATURN_AGENT_MEMORY_TURNS:-}
      - SATURN_AGENT_MEMORY_TTL_HOURS=${SATURN_AGENT_MEMORY_TTL_HOURS:-}
      - SATURN_AGENT_MAX_RETRIES=${SATURN_AGENT_MAX_RETRIES:-}
      - SATURN_AGENT_RETRY_BACKOFF_MILLIS=${SATURN_AGENT_RETRY_BACKOFF_MILLIS:-}
      - SATURN_AGENT_DYNAMIC_SQL_ENABLED=${SATURN_AGENT_DYNAMIC_SQL_ENABLED:-}
      - SATURN_AGENT_DYNAMIC_SQL_MAX_SQL_CHARS=${SATURN_AGENT_DYNAMIC_SQL_MAX_SQL_CHARS:-}
      - SATURN_AGENT_DYNAMIC_SQL_MAX_ROWS=${SATURN_AGENT_DYNAMIC_SQL_MAX_ROWS:-}
      - SATURN_AGENT_DYNAMIC_SQL_MAX_COLUMNS=${SATURN_AGENT_DYNAMIC_SQL_MAX_COLUMNS:-}
      - SATURN_AGENT_DYNAMIC_SQL_MAX_CELL_CHARS=${SATURN_AGENT_DYNAMIC_SQL_MAX_CELL_CHARS:-}
      - SATURN_AGENT_DYNAMIC_SQL_MAX_RESULT_CHARS=${SATURN_AGENT_DYNAMIC_SQL_MAX_RESULT_CHARS:-}
      - SATURN_AGENT_DYNAMIC_SQL_TIMEOUT_MILLIS=${SATURN_AGENT_DYNAMIC_SQL_TIMEOUT_MILLIS:-}
